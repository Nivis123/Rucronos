openapi: 3.1.0

info:
  title: RuChronos Manager API
  version: 0.1.0
  summary: Control Plane API (Spring Boot BFF) для мобильного приложения RuChronos Manager.
  description: |
    API бэкенда **RuChronos Manager** — контура управления (Control Plane) над кластером
    PostgreSQL с расширением RuChronos Core. Требования к API идут от мобильного приложения
    (Flutter): каждый раздел ниже соответствует экрану приложения.

    | Экран приложения | Что даёт API | Теги |
    | --- | --- | --- |
    | Загрузка и вход | Вход (пока заглушка), профиль, регистрация устройства для пушей | `Auth`, `Me` |
    | 1. Кластер | Топология мастер → реплики, CPU / RAM / диск, метрики ядра | `Cluster` |
    | 2. Таблицы и графики | Поиск таблиц с подсказками, схема таблицы, список доступных графиков | `Tables` |
    | 3. Быстрые команды | Каталог безопасных команд, запуск, статус и результат | `Quick actions` |
    | 4. Пороги и алерты | Конструктор порогов, каналы уведомлений, журнал инцидентов | `Thresholds`, `Notification channels`, `Incidents` |
    | Живые данные | **Графики и обновления идут только по WebSocket** — см. `GET /ws` | `Realtime` |

    ## Общие соглашения

    - **Базовый путь** — `/api/v1`. Все тела запросов и ответов в JSON (`application/json`).
    - **Время** в REST — строки RFC 3339 в UTC (`2026-10-23T09:15:00Z`). В WebSocket-сообщениях
      время точек графика — миллисекунды Unix epoch (компактнее для потока).
    - **Авторизация** — заголовок `Authorization: Bearer <accessToken>`. Сейчас токен выдаёт
      заглушка `POST /auth/login`. В проде токен будет выдавать система входа клиента
      (у каждого заказчика своя: Keycloak, AD/LDAP и т. п.), бэкенд только проверяет его.
    - **Роли (RBAC):** `viewer` — только чтение; `operator` — плюс быстрые команды, подтверждение
      и закрытие инцидентов; `admin` — плюс пороги, каналы уведомлений и команды с подтверждением.
      Требуемая роль указана в описании каждой операции.
    - **Ошибки** — формат `application/problem+json` (RFC 9457), поле `code` — машиночитаемый код.
    - **Пагинация списков** — курсорная: `?limit=&cursor=`, в ответе `nextCursor` (`null` — конец).
    - **Идентификатор таблицы** (`tableId`) — полное имя `schema.table`, например `public.k8s_nodes`.
      В пути его нужно URL-кодировать как обычную строку.
    - **Ключи метрик узла** (`cpuUsagePercent`, `ramUsagePercent`, …) совпадают с именами полей
      в объекте `NodeMetrics`, чтобы клиент мог брать значение как `metrics[key]`.

    ## Чего в API нет намеренно

    - Произвольного SQL. Быстрые команды — только из белого списка на сервере;
      `DROP TABLE`, `DROP DATABASE` и другие разрушающие операции не реализуются вообще.
    - Записи телеметрии. Данные пишутся напрямую в PostgreSQL (Data Plane), Java-сервис их только читает.
    - Порт PostgreSQL 5432 наружу не открывается: мобильное приложение ходит только в этот API.
  contact:
    name: Команда RuChronos (pg_t10s)
  license:
    name: Proprietary

servers:
  - url: https://{host}/api/v1
    description: Инсталляция RuChronos Manager у клиента
    variables:
      host:
        default: manager.example.local
  - url: http://localhost:8080/api/v1
    description: Локальная разработка

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Вход в приложение. Пока заглушка (mock), см. описание `POST /auth/login`.
  - name: Me
    description: Текущий пользователь и его устройства для пуш-уведомлений.
  - name: Cluster
    description: Экран 1 — топология кластера и здоровье узлов (снимок; живые обновления — по WebSocket).
  - name: Tables
    description: Экран 2 — обозреватель таблиц. Данные графиков приходят по WebSocket.
  - name: Quick actions
    description: Экран 3 — быстрые команды к кластеру (белый список безопасных операций).
  - name: Thresholds
    description: Экран 4 — пороги (thresholds) на метрики узлов, таблиц и колонок.
  - name: Notification channels
    description: Экран 4 — куда слать алерты (пуш, почта, Telegram). Отправку делает бэкенд, не приложение.
  - name: Incidents
    description: Экран 4 — журнал инцидентов (сработавших порогов).
  - name: Realtime
    description: WebSocket-канал для графиков, обновлений кластера, инцидентов и статусов команд.
  - name: System
    description: Служебные ручки.

paths:

  # ---------------------------------------------------------------- System

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Проверка живости сервиса
      description: Не требует авторизации. Используется балансировщиком и экраном загрузки приложения.
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: up
                version: 0.1.0
                database: up

  # ---------------------------------------------------------------- Auth

  /auth/config:
    get:
      tags: [Auth]
      operationId: getAuthConfig
      summary: Как в этой инсталляции устроен вход
      description: |
        Приложение вызывает при запуске, чтобы решить, какой экран входа показать:
        форму логина (режим `mock`) или переход на страницу входа клиента (режим `oidc`).
        Не требует авторизации.
      security: []
      responses:
        '200':
          description: Конфигурация входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
              examples:
                mock:
                  summary: Заглушка (текущий этап)
                  value:
                    mode: mock
                    oidc: null
                oidc:
                  summary: Вход через систему клиента
                  value:
                    mode: oidc
                    oidc:
                      issuer: https://sso.client.local/realms/main
                      clientId: ruchronos-mobile
                      scopes: [openid, profile, email]

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по логину и паролю (заглушка)
      description: |
        **Mock.** Свою систему аутентификации не делаем: у каждого клиента она уже есть,
        и он подключит её сам (режим `oidc`). На этом этапе ручка принимает тестовых
        пользователей из конфигурации бэкенда (например, `admin/admin`, `operator/operator`,
        `viewer/viewer`) и выдаёт JWT. В режиме `oidc` возвращает `404`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Вход по паролю выключен (режим `oidc`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Обновить access-токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов (refresh-токен ротируется)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти
      description: Отзывает refresh-токен. Устройство для пушей стоит удалить отдельно (`DELETE /me/devices/{deviceId}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Выход выполнен
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Me

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Текущий пользователь
      description: Роли определяют, какие кнопки показывать в приложении. Роль — любая.
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/devices:
    get:
      tags: [Me]
      operationId: listMyDevices
      summary: Мои устройства для пуш-уведомлений
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Me]
      operationId: registerDevice
      summary: Зарегистрировать устройство для пушей
      description: |
        Приложение вызывает после входа и при каждом обновлении push-токена.
        Повторная регистрация того же `pushToken` обновляет запись, а не создаёт новую.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
            example:
              provider: fcm
              pushToken: dGhpcyBpcyBhIGZha2UgdG9rZW4
              platform: android
              deviceName: Pixel 8
      responses:
        '200':
          description: Устройство уже было, запись обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '201':
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/devices/{deviceId}:
    delete:
      tags: [Me]
      operationId: deleteDevice
      summary: Отвязать устройство
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Устройство отвязано, пуши на него больше не приходят
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Cluster

  /cluster:
    get:
      tags: [Cluster]
      operationId: getCluster
      summary: Топология и состояние кластера (главный экран)
      description: |
        Снимок для первой отрисовки главного экрана: мастер (primary), его нагрузка,
        затем реплики и их нагрузка. Дальше экран обновляется по WebSocket
        (канал `cluster`, сообщения `cluster.update`), повторно опрашивать эту ручку не нужно.
        Роль — любая.
      responses:
        '200':
          description: Состояние кластера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterOverview'
              example:
                name: prod-metrics
                status: healthy
                updatedAt: '2026-10-23T09:15:00Z'
                primary:
                  id: node-1
                  role: primary
                  host: pg-master-1.local
                  port: 5432
                  status: online
                  postgresVersion: '17.2'
                  ruchronosVersion: 0.3.0
                  metrics:
                    cpuUsagePercent: 63.5
                    ramUsagePercent: 71.2
                    ramUsedBytes: 24461180928
                    ramTotalBytes: 34359738368
                    diskUsagePercent: 48.0
                    diskUsedBytes: 494780232499
                    diskTotalBytes: 1030792151040
                    temperatureCelsius: null
                    ingestionRate: 182000
                    compressionRatio: 7.8
                    walWriteBytesPerSec: 15728640
                    replicationLagMs: null
                  replication: null
                replicas:
                  - id: node-2
                    role: replica
                    host: pg-replica-1.local
                    port: 5432
                    status: online
                    postgresVersion: '17.2'
                    ruchronosVersion: 0.3.0
                    metrics:
                      cpuUsagePercent: 22.1
                      ramUsagePercent: 55.0
                      ramUsedBytes: 18897856102
                      ramTotalBytes: 34359738368
                      diskUsagePercent: 47.6
                      diskUsedBytes: 490657095270
                      diskTotalBytes: 1030792151040
                      temperatureCelsius: null
                      ingestionRate: 0
                      compressionRatio: 7.8
                      walWriteBytesPerSec: 0
                      replicationLagMs: 12
                    replication:
                      state: streaming
                      lagMs: 12
                      lagBytes: 65536
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /cluster/nodes/{nodeId}:
    get:
      tags: [Cluster]
      operationId: getNode
      summary: Состояние одного узла
      description: Для экрана подробностей узла (по нажатию на мастер или реплику). Роль — любая.
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Состояние узла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cluster/metrics:
    get:
      tags: [Cluster]
      operationId: listNodeMetrics
      summary: Справочник метрик узла
      description: |
        Какие метрики узла есть, их единицы и диапазон. Нужен для подписей на главном экране
        и для конструктора порогов (выпадающий список «метрика»). Роль — любая.
      responses:
        '200':
          description: Справочник
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricDescriptor'
              example:
                - key: cpuUsagePercent
                  title: Загрузка CPU
                  unit: percent
                  min: 0
                  max: 100
                  supported: true
                - key: temperatureCelsius
                  title: Температура CPU
                  unit: celsius
                  min: null
                  max: null
                  supported: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Tables

  /tables:
    get:
      tags: [Tables]
      operationId: searchTables
      summary: Поиск таблиц (строка поиска с подсказками)
      description: |
        Ручка под поисковую строку: при каждом вводе приложение запрашивает подсказки
        (рекомендуется debounce ~300 мс). Пустой `q` — все таблицы по алфавиту.
        Поиск по подстроке в `schema.table`, без учёта регистра. Роль — любая.
      parameters:
        - name: q
          in: query
          description: Подстрока имени таблицы
          schema:
            type: string
            maxLength: 128
          example: k8s
        - name: accessMethod
          in: query
          description: Фильтр по движку хранения. Без параметра — все таблицы.
          schema:
            $ref: '#/components/schemas/AccessMethod'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Найденные таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSummaryPage'
              example:
                items:
                  - id: public.k8s_nodes
                    schema: public
                    name: k8s_nodes
                    accessMethod: ruchronos_tam
                    rowCountEstimate: 418000000
                    sizeBytes: 21474836480
                    compressionRatio: 8.1
                  - id: public.k8s_pods_events
                    schema: public
                    name: k8s_pods_events
                    accessMethod: ruchronos_tam
                    rowCountEstimate: 92000000
                    sizeBytes: 6442450944
                    compressionRatio: 5.4
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tables/{tableId}:
    get:
      tags: [Tables]
      operationId: getTable
      summary: Схема таблицы и доступные графики
      description: |
        Приложение вызывает после выбора таблицы в поиске. Возвращает колонки и список
        графиков, которые можно построить для этой таблицы (`charts`). Данные графиков
        приходят по WebSocket: подписка `chart` с `tableId` и `chartId` из этого списка.

        **Какие графики доступны** (зависит от сигнатуры таблицы):
        - `ingestion_rate` — **есть всегда**, для любой таблицы: сколько строк вставлено
          за интервал (строк/с). Это универсальный график, даже если таблица вида
          «timestamp + текст» и как рисовать её значения непонятно.
        - `column:<имя>` — для каждой числовой колонки, если в таблице есть колонка времени
          (`timestamp`/`timestamptz`): обычный график значения во времени с агрегацией.
        - Колонки других типов (текст, json и т. п.) графиков не дают.
        Роль — любая.
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: Детали таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetails'
              example:
                id: public.k8s_nodes
                schema: public
                name: k8s_nodes
                accessMethod: ruchronos_tam
                rowCountEstimate: 418000000
                sizeBytes: 21474836480
                compressionRatio: 8.1
                timeColumn: ts
                columns:
                  - name: ts
                    dataType: timestamptz
                    nullable: false
                    kind: time
                  - name: node_name
                    dataType: text
                    nullable: false
                    kind: text
                  - name: memory_utilization
                    dataType: double precision
                    nullable: true
                    kind: numeric
                charts:
                  - id: ingestion_rate
                    type: ingestion_rate
                    title: Скорость вставки
                    unit: rows_per_sec
                    column: null
                    aggregations: [sum]
                    defaultAggregation: sum
                  - id: column:memory_utilization
                    type: column
                    title: memory_utilization
                    unit: null
                    column: memory_utilization
                    aggregations: [avg, min, max, last]
                    defaultAggregation: avg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Quick actions

  /actions:
    get:
      tags: [Quick actions]
      operationId: listActions
      summary: Каталог быстрых команд
      description: |
        Список кнопок для экрана быстрых команд. Каталог задаётся на сервере (белый список):
        каждая команда — заранее написанный SQL или вызов функции ядра RuChronos.
        Разрушающих команд (`DROP TABLE`, `DROP DATABASE`, `TRUNCATE` и т. п.) в каталоге нет и не будет.
        Роль — любая (запуск — см. `POST /actions/{actionId}/runs`).
      responses:
        '200':
          description: Каталог
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuickAction'
              example:
                - id: collect_diagnostics
                  title: Диагностика кластера
                  description: Снимок pg_stat_activity, pg_stat_database и блокировок.
                  category: diagnostics
                  target: cluster
                  params: []
                  requiresConfirmation: false
                  minRole: operator
                - id: force_compaction
                  title: Принудительное сжатие чанков
                  description: Сжимает активные чанки выбранной таблицы RuChronos.
                  category: maintenance
                  target: table
                  params:
                    - name: olderThanMinutes
                      type: integer
                      required: false
                      default: 60
                      description: Сжимать только чанки старше N минут
                  requiresConfirmation: true
                  minRole: admin
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actions/{actionId}/runs:
    post:
      tags: [Quick actions]
      operationId: runAction
      summary: Запустить быструю команду
      description: |
        Запуск асинхронный: сразу возвращается `202` с запуском в статусе `queued`.
        Ход выполнения — по WebSocket (канал `action_runs`) или опросом `GET /action-runs/{runId}`.

        Для команд с `requiresConfirmation: true` приложение должно показать диалог
        подтверждения и передать `confirm: true`, иначе сервер вернёт `409`.
        Чтобы двойное нажатие не запустило команду дважды, передавайте `Idempotency-Key`.
        Роль — не ниже `minRole` команды. Каждый запуск пишется в аудит.
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRunRequest'
            example:
              target:
                tableId: public.k8s_nodes
              params:
                olderThanMinutes: 120
              confirm: true
      responses:
        '202':
          description: Команда поставлена в очередь
          headers:
            Location:
              description: Адрес запуска, `/api/v1/action-runs/{runId}`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Нужно подтверждение (`confirm: true`) или такая же команда по этой цели уже выполняется'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /action-runs:
    get:
