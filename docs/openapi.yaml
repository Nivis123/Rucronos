        Сработавшие пороги, новые сверху. Жизненный цикл инцидента:
        `open` → `acknowledged` (взят в работу) → `resolved`.
        Инцидент закрывается автоматически, когда значение вернулось в норму
        (`resolution: auto`), или вручную (`resolution: manual`).
        Новые инциденты и смена статуса приходят по WebSocket (канал `incidents`). Роль — любая.
      parameters:
        - name: status
          in: query
