  # ---------------------------------------------------------------- Realtime (WebSocket)

  /ws:
    get:
      tags: [Realtime]
      operationId: openWebSocket
      summary: WebSocket — графики и живые обновления
      description: |
        Единое WebSocket-соединение (`wss://{host}/api/v1/ws`) на всё приложение.
        По нему идут **все графики**, обновления главного экрана, новые инциденты
        и статусы быстрых команд. REST при этом отдаёт только снимки и справочники.

        OpenAPI не умеет полноценно описывать WebSocket, поэтому здесь описан handshake,
        а форматы сообщений — схемы `WsClientMessage` (клиент → сервер) и `WsServerMessage`
        (сервер → клиент) в `components`. Все сообщения — текстовые фреймы с JSON,
        тип определяется полем `type`.

        ### 1. Подключение и авторизация
        1. Клиент открывает соединение без токена в URL (чтобы токен не попадал в логи прокси).
        2. Первым сообщением, не позже 5 секунд, клиент шлёт `{"type":"auth","token":"<accessToken>"}`.
        3. Сервер отвечает `auth.ok`. Иначе закрывает соединение с кодом `4401` или `4408`.
        4. Когда access-токен скоро истечёт, клиент шлёт новый `auth` в том же соединении — переподключаться не нужно.

        ### 2. Подписки
        Клиент шлёт `subscribe` со своим `subscriptionId` (любая уникальная строка) и каналом:

        | Канал | Параметры | Что приходит | Экран |
        | --- | --- | --- | --- |
        | `cluster` | — | `cluster.snapshot`, затем `cluster.update` (по умолчанию раз в 1 с) | Кластер |
        | `chart` | `tableId`, `chartId`, `range`, `aggregation` | `chart.snapshot`, затем `chart.points` | Графики |
        | `incidents` | — | `incident.event` при открытии и смене статуса | Пороги и алерты |
        | `action_runs` | `runId` (необязательно) | `action_run.update` при смене статуса | Быстрые команды |

        Сервер подтверждает подписку сообщением `subscribed` или присылает `error`
        с тем же `subscriptionId`. Отписка — `unsubscribe`. При уходе с экрана
        клиент должен отписываться, чтобы сервер не гонял лишние данные.

        ### 3. Графики
        - После `subscribe` на `chart` сервер присылает `chart.snapshot`: агрегированную историю
          за выбранный диапазон (агрегация выполняется в БД) и пороги для наложения линий на график.
        - Затем приходят `chart.points` — новые точки, не чаще 10 раз в секунду (пачками).
          Клиент складывает их в кольцевой буфер и рисует 60 FPS сам, сдвигая окно графика.
        - Смена диапазона (LIVE / 15 мин / 1 час / 24 часа) или агрегации — новый `subscribe`
          с тем же `subscriptionId`: сервер заменит подписку и пришлёт новый `chart.snapshot`.
        - Шаг агрегации выбирает сервер и сообщает в `stepMs`. Ориентиры: `live` — 1 с,
          `15m` — 5 с, `1h` — 15 с, `24h` — 5 мин.
        - Точка — пара `[timestampMs, value]`. `value: null` — данных за интервал нет (разрыв линии).

        ### 4. Поддержание соединения
        - Клиент шлёт `ping` каждые 30 с, сервер отвечает `pong`. Без сообщений 90 с сервер закрывает соединение.
        - После обрыва клиент переподключается с экспоненциальной задержкой (1, 2, 4… до 30 с),
          заново проходит `auth` и восстанавливает подписки. Снимки придут заново.

        ### 5. Коды закрытия
        | Код | Причина |
        | --- | --- |
        | `1000` | Нормальное закрытие |
        | `4400` | Некорректное сообщение |
        | `4401` | Токен невалиден или истёк |
        | `4403` | Недостаточно прав |
        | `4408` | Не прислан `auth` за 5 секунд |
        | `4429` | Слишком много подписок (лимит — 20 на соединение) |

        ### Пример обмена
        ```
        → {"type":"auth","token":"eyJ..."}
        ← {"type":"auth.ok","user":{"id":"admin","roles":["admin"]},"serverTime":1792746900000}
        → {"type":"subscribe","subscriptionId":"chart-1","channel":"chart",
           "params":{"tableId":"public.k8s_nodes","chartId":"column:memory_utilization",
                     "range":"15m","aggregation":"avg"}}
        ← {"type":"subscribed","subscriptionId":"chart-1"}
        ← {"type":"chart.snapshot","subscriptionId":"chart-1","chartId":"column:memory_utilization",
           "range":"15m","aggregation":"avg","stepMs":5000,"unit":null,
           "from":1792746000000,"to":1792746900000,
           "points":[[1792746000000,71.2],[1792746005000,71.9]],
           "thresholds":[{"thresholdId":"5a1b...","name":"Память нод k8s","operator":"gt","value":92,"severity":"warning"}]}
        ← {"type":"chart.points","subscriptionId":"chart-1","points":[[1792746905000,72.4]]}
        → {"type":"unsubscribe","subscriptionId":"chart-1"}
        ```
      security: []
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            const: '13'
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols — соединение установлено, дальше обмен сообщениями `WsClientMessage` / `WsServerMessage`
        '426':
          description: Запрос без Upgrade на WebSocket
      x-websocket:
        clientMessages:
          $ref: '#/components/schemas/WsClientMessage'
        serverMessages:
          $ref: '#/components/schemas/WsServerMessage'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен из `POST /auth/login` (заглушка) или из системы входа клиента (режим `oidc`).
        Роли пользователя — в claim `roles`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Курсор из `nextCursor` предыдущей страницы
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
      example: node-1
    TableId:
      name: tableId
      in: path
      required: true
      description: Полное имя таблицы `schema.table`
      schema:
        type: string
        pattern: '^[^.]+\.[^.]+$'
      example: public.k8s_nodes
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
      example: force_compaction
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThresholdId:
      name: thresholdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Уникальная строка (UUID) на одно нажатие кнопки. Повтор запроса с тем же ключом
        в течение 24 часов вернёт уже созданный запуск, а не запустит команду ещё раз.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: Некорректный запрос (валидация)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://ruchronos.dev/problems/validation
            title: Ошибка валидации
            status: 400
            code: validation_error
            detail: 'condition.value: обязательное поле'
            errors:
              - field: condition.value
                message: обязательное поле
    Unauthorized:
      description: Нет токена, токен невалиден или истёк
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://ruchronos.dev/problems/unauthorized
            title: Требуется авторизация
            status: 401
            code: token_expired
    Forbidden:
      description: Недостаточно прав для операции
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://ruchronos.dev/problems/forbidden
            title: Недостаточно прав
            status: 403
            code: role_required
            detail: Требуется роль admin
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Запрос корректен по формату, но не может быть выполнен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Слишком много попыток, повторите позже
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClusterUnavailable:
      description: Бэкенд не может подключиться к PostgreSQL
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://ruchronos.dev/problems/cluster-unavailable
            title: Кластер недоступен
            status: 503
            code: cluster_unavailable

  schemas:

    # ------------------------------------------------------------ Common

    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (Problem Details)
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Машиночитаемый код ошибки
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Ошибки по полям (для `400`)
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [up, degraded, down]
        version:
          type: string
        database:
          type: string
          enum: [up, down]
          description: Есть ли соединение бэкенда с PostgreSQL

    Severity:
      type: string
      enum: [info, warning, critical]

    # ------------------------------------------------------------ Auth / Me

    AuthConfig:
      type: object
      required: [mode, oidc]
      properties:
        mode:
          type: string
          enum: [mock, oidc]
          description: |
            `mock` — форма логина и пароля, `POST /auth/login` (текущий этап).
            `oidc` — вход через систему клиента по OpenID Connect (Authorization Code + PKCE).
        oidc:
          oneOf:
            - type: 'null'
            - type: object
              required: [issuer, clientId, scopes]
              properties:
                issuer:
                  type: string
                  format: uri
                clientId:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Время жизни access-токена, секунды
          example: 900

    Role:
      type: string
      enum: [viewer, operator, admin]
      description: |
        `viewer` — только чтение. `operator` — плюс быстрые команды без подтверждения,
        подтверждение и закрытие инцидентов. `admin` — всё, включая пороги, каналы
        и команды с подтверждением.

    User:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    DeviceRegistration:
      type: object
      required: [provider, pushToken, platform]
      properties:
        provider:
          type: string
          enum: [fcm, apns, rustore]
          description: Сервис доставки пушей. `rustore` — RuStore Push для устройств без сервисов Google.
        pushToken:
          type: string
        platform:
          type: string
          enum: [android, ios, web]
        deviceName:
          type: string

    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceRegistration'
        - type: object
          required: [id, createdAt, lastSeenAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            lastSeenAt:
              type: string
              format: date-time

    # ------------------------------------------------------------ Cluster

    ClusterOverview:
      type: object
      required: [name, status, primary, replicas, updatedAt]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, critical, unknown]
          description: |
            Сводный статус для цвета на главном экране: `degraded` — хотя бы одна реплика
            недоступна или отстаёт; `critical` — мастер недоступен.
        primary:
          $ref: '#/components/schemas/NodeState'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/NodeState'
        updatedAt:
          type: string
          format: date-time

    NodeState:
      type: object
      required: [id, role, host, port, status, metrics, replication]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [primary, replica]
          description: '`primary` — мастер, `replica` — реплика'
        host:
          type: string
        port:
          type: integer
        status:
          type: string
          enum: [online, degraded, offline]
        postgresVersion:
          type: string
        ruchronosVersion:
          type: string
          description: Версия расширения RuChronos Core на узле
        metrics:
          $ref: '#/components/schemas/NodeMetrics'
        replication:
          description: Только для реплик, у мастера `null`
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReplicationState'

    NodeMetrics:
      type: object
      description: |
        Текущие метрики узла. Имена полей совпадают с ключами `NodeMetricKey`.
        Метрика, которую узел не умеет отдавать (например, температура в виртуалке), — `null`.
        Собираются агентом на узле из стандартных средств Linux (`/proc`, `df`, `top`)
        и статистики PostgreSQL / RuChronos.
      required:
        - cpuUsagePercent
        - ramUsagePercent
        - ramUsedBytes
        - ramTotalBytes
        - diskUsagePercent
        - diskUsedBytes
        - diskTotalBytes
      properties:
        cpuUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        ramUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        ramUsedBytes:
          type: integer
          format: int64
        ramTotalBytes:
          type: integer
          format: int64
        diskUsagePercent:
          type: number
          minimum: 0
          maximum: 100
          description: Заполненность диска с каталогом данных PostgreSQL
        diskUsedBytes:
          type: integer
          format: int64
        diskTotalBytes:
          type: integer
          format: int64
        temperatureCelsius:
          type: [number, 'null']
          description: Необязательная метрика, «если есть возможность»
        ingestionRate:
          type: [number, 'null']
          description: Скорость вставки во все таблицы RuChronos на узле, строк/с
        compressionRatio:
          type: [number, 'null']
          description: Средний коэффициент сжатия TAM (во сколько раз данные меньше, чем в heap)
        walWriteBytesPerSec:
          type: [number, 'null']
          description: Активность кастомного WAL, байт/с
        replicationLagMs:
          type: [number, 'null']
          description: Лаг репликации, мс (только у реплик)

    NodeMetricKey:
      type: string
      description: Ключ метрики узла — совпадает с именем поля в `NodeMetrics`
      enum:
        - cpuUsagePercent
        - ramUsagePercent
        - diskUsagePercent
        - temperatureCelsius
        - ingestionRate
        - compressionRatio
        - walWriteBytesPerSec
        - replicationLagMs

    ReplicationState:
      type: object
      required: [state, lagMs]
      properties:
        state:
          type: string
          enum: [streaming, catchup, stopped]
        lagMs:
          type: number
        lagBytes:
          type: integer
          format: int64

    MetricDescriptor:
      type: object
      required: [key, title, unit, supported]
      properties:
        key:
          $ref: '#/components/schemas/NodeMetricKey'
        title:
          type: string
        unit:
          $ref: '#/components/schemas/Unit'
        min:
          type: [number, 'null']
        max:
          type: [number, 'null']
        supported:
          type: boolean
          description: Отдаёт ли эту метрику текущая инсталляция (например, температура — не везде)

    Unit:
      type: [string, 'null']
      enum: [percent, bytes, bytes_per_sec, rows, rows_per_sec, ms, celsius, ratio, null]

    # ------------------------------------------------------------ Tables

    AccessMethod:
      type: string
      enum: [ruchronos_tam, heap, other]
      description: Движок хранения таблицы. `ruchronos_tam` — создана через `USING ruchronos_tam`.

    TableSummary:
      type: object
      required: [id, schema, name, accessMethod, rowCountEstimate, sizeBytes, compressionRatio]
      properties:
        id:
          type: string
          description: '`schema.table`'
        schema:
          type: string
        name:
          type: string
        accessMethod:
          $ref: '#/components/schemas/AccessMethod'
        rowCountEstimate:
          type: integer
          format: int64
          description: Оценка числа строк по статистике (быстро, без `count(*)`)
        sizeBytes:
          type: integer
          format: int64
        compressionRatio:
          type: [number, 'null']
          description: Только для таблиц RuChronos, иначе `null`

    TableDetails:
      allOf:
        - $ref: '#/components/schemas/TableSummary'
        - type: object
          required: [columns, timeColumn, charts]
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/TableColumn'
            timeColumn:
              type: [string, 'null']
              description: Колонка времени, по которой строятся графики колонок. `null` — её нет, доступен только `ingestion_rate`.
            charts:
              type: array
              description: Графики, которые можно построить. Первым всегда идёт `ingestion_rate`.
              items:
                $ref: '#/components/schemas/ChartDescriptor'

    TableColumn:
      type: object
      required: [name, dataType, nullable, kind]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Тип PostgreSQL как есть (`timestamptz`, `double precision`, `bigint`, `text`…)
        nullable:
          type: boolean
        kind:
          type: string
          enum: [time, numeric, text, other]
          description: Упрощённый тип для приложения — от него зависят доступные графики и пороги

    ChartDescriptor:
      type: object
      required: [id, type, title, unit, column, aggregations, defaultAggregation]
      properties:
        id:
          type: string
          description: '`ingestion_rate` или `column:<имя колонки>`. Передаётся в подписке `chart`.'
          examples: [ingestion_rate, 'column:memory_utilization']
        type:
          type: string
          enum: [ingestion_rate, column]
        title:
          type: string
        unit:
          $ref: '#/components/schemas/Unit'
        column:
          type: [string, 'null']
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/Aggregation'
        defaultAggregation:
          $ref: '#/components/schemas/Aggregation'

    Aggregation:
      type: string
      enum: [avg, min, max, last, sum, count]
      description: Как сворачивать значения внутри одного интервала (шага) графика или окна порога

    ChartRange:
      type: string
      enum: [live, 15m, 1h, 24h]
      description: Переключатель диапазона на экране графика

    TableSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableSummary'
        nextCursor:
          type: [string, 'null']

    # ------------------------------------------------------------ Quick actions

    QuickAction:
      type: object
      required: [id, title, description, category, target, params, requiresConfirmation, minRole]
      description: |
        Кнопка на экране быстрых команд. Каталог на сервере — белый список.
        Начальный набор: `collect_diagnostics` (снимок pg_stat_*), `top_queries`
        (тяжёлые запросы из pg_stat_statements), `analyze_table` (`ANALYZE` для обновления
        статистики), `force_compaction` (сжатие чанков RuChronos), `apply_retention`
        (очистка по уже настроенной политике хранения, только с подтверждением),
        `failover_check` (проверка готовности реплики к переключению — без самого переключения).
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [diagnostics, maintenance, replication]
        target:
          type: string
          enum: [cluster, node, table]
          description: К чему применяется команда — от этого зависит, что спросить у пользователя перед запуском
        params:
          type: array
          items:
            $ref: '#/components/schemas/ActionParam'
        requiresConfirmation:
          type: boolean
          description: 'Показать диалог подтверждения и передать `confirm: true`'
        minRole:
          $ref: '#/components/schemas/Role'

    ActionParam:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [integer, number, string, boolean]
        required:
          type: boolean
        default: {}
        description:
          type: string

    ActionRunRequest:
      type: object
      required: [target]
      properties:
        target:
          $ref: '#/components/schemas/ActionTarget'
        params:
          type: object
          additionalProperties: true
          description: Значения параметров по описанию `QuickAction.params`
        confirm:
          type: boolean
          default: false

    ActionTarget:
      type: object
      description: 'Пустой объект для команд с `target: cluster`'
      properties:
        nodeId:
          type: string
        tableId:
          type: string

    ActionRunStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    ActionRun:
      type: object
      required: [id, actionId, status, target, params, startedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actionId:
          type: string
        status:
          $ref: '#/components/schemas/ActionRunStatus'
        target:
          $ref: '#/components/schemas/ActionTarget'
        params:
          type: object
          additionalProperties: true
        startedBy:
          type: string
          description: Пользователь, запустивший команду (для аудита)
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        result:
          description: Есть при `succeeded`
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ActionResult'
        error:
          description: Есть при `failed`
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string

    ActionResult:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Короткий итог для показа на экране
        table:
          description: Результат в виде таблицы (для диагностических команд)
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items: {}

    ActionRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionRun'
        nextCursor:
          type: [string, 'null']

    # ------------------------------------------------------------ Thresholds

    ThresholdTargetKind:
      type: string
      enum: [node_metric, table_metric, column]

    ThresholdTarget:
      description: На что повешен порог
      oneOf:
        - $ref: '#/components/schemas/NodeMetricTarget'
        - $ref: '#/components/schemas/TableMetricTarget'
        - $ref: '#/components/schemas/ColumnTarget'
      discriminator:
        propertyName: kind
        mapping:
          node_metric: '#/components/schemas/NodeMetricTarget'
          table_metric: '#/components/schemas/TableMetricTarget'
          column: '#/components/schemas/ColumnTarget'

    NodeMetricTarget:
      type: object
      required: [kind, nodeId, metric]
      properties:
        kind:
          type: string
          const: node_metric
        nodeId:
          type: [string, 'null']
          description: Конкретный узел или `null` — порог на каждый узел кластера
        metric:
          $ref: '#/components/schemas/NodeMetricKey'

    TableMetricTarget:
      type: object
      required: [kind, tableId, metric]
      properties:
        kind:
          type: string
          const: table_metric
        tableId:
          type: string
        metric:
          type: string
          enum: [rowCount, sizeBytes, ingestionRate]
          description: '`rowCount` — заполненность таблицы (строк), `sizeBytes` — размер на диске, `ingestionRate` — строк/с'

    ColumnTarget:
      type: object
      required: [kind, tableId, column, aggregation, windowSeconds]
      properties:
        kind:
          type: string
          const: column
        tableId:
          type: string
        column:
          type: string
          description: Числовая колонка таблицы с колонкой времени
        aggregation:
          $ref: '#/components/schemas/Aggregation'
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Окно, за которое считается агрегат (например, среднее за последние 60 с)

    ThresholdCondition:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [gt, gte, lt, lte]
          description: '`gt` — больше, `gte` — больше или равно, `lt` — меньше, `lte` — меньше или равно'
        value:
          type: number

    ThresholdInput:
      type: object
      required: [name, target, condition, severity, channelIds]
      properties:
        name:
          type: string
          maxLength: 120
        enabled:
          type: boolean
          default: true
        target:
          $ref: '#/components/schemas/ThresholdTarget'
        condition:
          $ref: '#/components/schemas/ThresholdCondition'
        forSeconds:
          type: integer
          minimum: 0
          default: 0
          description: Сколько секунд условие должно держаться, прежде чем открыть инцидент (защита от кратких всплесков)
        severity:
          $ref: '#/components/schemas/Severity'
        channelIds:
          type: array
          description: Каналы уведомлений. Пустой список — инцидент только в журнале, без уведомлений.
          items:
            type: string
            format: uuid
        cooldownSeconds:
          type: integer
          minimum: 0
          default: 900
          description: Не повторять уведомление по открытому инциденту чаще, чем раз в N секунд

    ThresholdPatch:
      type: object
      description: Любое подмножество полей `ThresholdInput`
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        enabled:
          type: boolean
        target:
          $ref: '#/components/schemas/ThresholdTarget'
        condition:
          $ref: '#/components/schemas/ThresholdCondition'
        forSeconds:
          type: integer
          minimum: 0
        severity:
          $ref: '#/components/schemas/Severity'
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        cooldownSeconds:
          type: integer
          minimum: 0

    Threshold:
      allOf:
        - $ref: '#/components/schemas/ThresholdInput'
        - type: object
          required: [id, enabled, state, createdAt, updatedAt, createdBy]
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
              enum: [ok, firing, no_data, disabled]
              description: Текущее состояние проверки (для цвета карточки порога)
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string

    ThresholdPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Threshold'
        nextCursor:
          type: [string, 'null']

    # ------------------------------------------------------------ Notification channels

    NotificationChannelInput:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          maxLength: 120
        config:
          $ref: '#/components/schemas/NotificationChannelConfig'

    NotificationChannelConfig:
      oneOf:
        - $ref: '#/components/schemas/PushChannelConfig'
        - $ref: '#/components/schemas/EmailChannelConfig'
        - $ref: '#/components/schemas/TelegramChannelConfig'
      discriminator:
        propertyName: type
        mapping:
          push: '#/components/schemas/PushChannelConfig'
          email: '#/components/schemas/EmailChannelConfig'
          telegram: '#/components/schemas/TelegramChannelConfig'

    PushChannelConfig:
      type: object
      required: [type, userIds]
      properties:
        type:
          type: string
          const: push
        userIds:
          type: array
          description: Пуш уходит на все зарегистрированные устройства этих пользователей
          items:
            type: string

    EmailChannelConfig:
      type: object
      required: [type, recipients]
      properties:
        type:
          type: string
          const: email
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            format: email

    TelegramChannelConfig:
      type: object
      required: [type, chatId]
      properties:
        type:
          type: string
          const: telegram
        chatId:
          type: string
        botToken:
          type: string
          writeOnly: true
          description: Токен бота. Только на запись — в ответах не возвращается.

    NotificationChannel:
      allOf:
        - $ref: '#/components/schemas/NotificationChannelInput'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            usedByThresholds:
              type: integer
              description: Во скольких порогах используется канал

    # ------------------------------------------------------------ Incidents

    IncidentStatus:
      type: string
      enum: [open, acknowledged, resolved]
      description: В интерфейсе показывается как OPEN / ACKNOWLEDGED / RESOLVED

    Incident:
      type: object
      required: [id, thresholdId, thresholdName, status, severity, target, condition, observedValue, openedAt]
      properties:
        id:
          type: string
          format: uuid
        thresholdId:
          type: string
          format: uuid
        thresholdName:
          type: string
          description: Имя порога на момент срабатывания
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        target:
          $ref: '#/components/schemas/ThresholdTarget'
        condition:
          $ref: '#/components/schemas/ThresholdCondition'
        observedValue:
          type: number
          description: Значение, при котором порог сработал
        openedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
        acknowledgedBy:
          type: [string, 'null']
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedBy:
          type: [string, 'null']
          description: '`null` при автоматическом закрытии'
        resolution:
          type: [string, 'null']
          enum: [auto, manual, threshold_deleted, null]
        comment:
          type: [string, 'null']

    IncidentComment:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000

    IncidentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        nextCursor:
          type: [string, 'null']

    # ------------------------------------------------------------ WebSocket messages

    ChartPoint:
      type: array
      description: '`[timestampMs, value]`. `value: null` — данных за интервал нет.'
      prefixItems:
        - type: integer
          format: int64
        - type: [number, 'null']
      minItems: 2
      maxItems: 2
      examples:
        - [1792746905000, 72.4]

    ChartThresholdLine:
      type: object
      description: Линия порога для наложения на график
      required: [thresholdId, name, operator, value, severity]
      properties:
        thresholdId:
          type: string
          format: uuid
        name:
          type: string
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        value:
          type: number
        severity:
          $ref: '#/components/schemas/Severity'

    WsClientMessage:
      description: Сообщения клиент → сервер
      oneOf:
        - $ref: '#/components/schemas/WsAuth'
        - $ref: '#/components/schemas/WsSubscribe'
        - $ref: '#/components/schemas/WsUnsubscribe'
        - $ref: '#/components/schemas/WsPing'
      discriminator:
        propertyName: type
        mapping:
          auth: '#/components/schemas/WsAuth'
          subscribe: '#/components/schemas/WsSubscribe'
          unsubscribe: '#/components/schemas/WsUnsubscribe'
          ping: '#/components/schemas/WsPing'

    WsAuth:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          const: auth
        token:
          type: string
          description: Access-токен (тот же, что в REST)

    WsSubscribe:
      type: object
      required: [type, subscriptionId, channel]
      properties:
        type:
          type: string
          const: subscribe
        subscriptionId:
          type: string
          maxLength: 64
          description: Идентификатор подписки, придумывает клиент. Повторный `subscribe` с тем же id заменяет подписку.
        channel:
          type: string
          enum: [cluster, chart, incidents, action_runs]
        params:
          description: Обязателен для `chart`; для `action_runs` необязателен; для остальных каналов не передаётся
          oneOf:
            - $ref: '#/components/schemas/WsChartParams'
            - $ref: '#/components/schemas/WsActionRunsParams'

    WsChartParams:
      type: object
      required: [tableId, chartId, range]
      properties:
        tableId:
          type: string
          example: public.k8s_nodes
        chartId:
          type: string
          description: '`id` из `TableDetails.charts`'
          example: column:memory_utilization
        range:
          $ref: '#/components/schemas/ChartRange'
        aggregation:
          $ref: '#/components/schemas/Aggregation'

    WsActionRunsParams:
      type: object
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
          description: Следить за одним запуском. Без параметра — за всеми запусками в кластере.

    WsUnsubscribe:
      type: object
      required: [type, subscriptionId]
      properties:
        type:
          type: string
          const: unsubscribe
        subscriptionId:
          type: string

    WsPing:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: ping

    WsServerMessage:
      description: Сообщения сервер → клиент
      oneOf:
        - $ref: '#/components/schemas/WsAuthOk'
        - $ref: '#/components/schemas/WsSubscribed'
        - $ref: '#/components/schemas/WsClusterSnapshot'
        - $ref: '#/components/schemas/WsClusterUpdate'
        - $ref: '#/components/schemas/WsChartSnapshot'
        - $ref: '#/components/schemas/WsChartPoints'
        - $ref: '#/components/schemas/WsIncidentEvent'
        - $ref: '#/components/schemas/WsActionRunUpdate'
        - $ref: '#/components/schemas/WsError'
        - $ref: '#/components/schemas/WsPong'
      discriminator:
        propertyName: type
        mapping:
          auth.ok: '#/components/schemas/WsAuthOk'
          subscribed: '#/components/schemas/WsSubscribed'
          cluster.snapshot: '#/components/schemas/WsClusterSnapshot'
          cluster.update: '#/components/schemas/WsClusterUpdate'
          chart.snapshot: '#/components/schemas/WsChartSnapshot'
          chart.points: '#/components/schemas/WsChartPoints'
          incident.event: '#/components/schemas/WsIncidentEvent'
          action_run.update: '#/components/schemas/WsActionRunUpdate'
          error: '#/components/schemas/WsError'
          pong: '#/components/schemas/WsPong'

    WsAuthOk:
      type: object
      required: [type, user, serverTime]
      properties:
        type:
          type: string
          const: auth.ok
        user:
          type: object
          required: [id, roles]
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
        serverTime:
          type: integer
          format: int64
          description: Время сервера, мс — чтобы клиент учёл расхождение часов при отрисовке LIVE-графика

    WsSubscribed:
      type: object
      required: [type, subscriptionId]
      properties:
        type:
          type: string
          const: subscribed
        subscriptionId:
          type: string

    WsClusterSnapshot:
      type: object
      required: [type, subscriptionId, cluster]
      properties:
        type:
          type: string
          const: cluster.snapshot
        subscriptionId:
          type: string
        cluster:
          $ref: '#/components/schemas/ClusterOverview'

    WsClusterUpdate:
      type: object
      description: Изменившиеся узлы. Узел приходит целиком; чего нет в `nodes` — не изменилось.
      required: [type, subscriptionId, status, nodes, updatedAt]
      properties:
        type:
          type: string
          const: cluster.update
        subscriptionId:
          type: string
        status:
          type: string
          enum: [healthy, degraded, critical, unknown]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeState'
        removedNodeIds:
          type: array
          description: Узлы, исчезнувшие из топологии
          items:
            type: string
        updatedAt:
          type: string
          format: date-time

    WsChartSnapshot:
      type: object
      description: История графика за диапазон (агрегирована в БД) + линии порогов. Приходит после каждого `subscribe` на `chart`.
      required: [type, subscriptionId, tableId, chartId, range, aggregation, stepMs, unit, from, to, points, thresholds]
      properties:
        type:
          type: string
          const: chart.snapshot
        subscriptionId:
          type: string
        tableId:
          type: string
        chartId:
          type: string
        range:
          $ref: '#/components/schemas/ChartRange'
        aggregation:
          $ref: '#/components/schemas/Aggregation'
        stepMs:
          type: integer
          description: Шаг агрегации, мс
        unit:
          $ref: '#/components/schemas/Unit'
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        points:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/ChartThresholdLine'

    WsChartPoints:
      type: object
      description: |
        Новые точки графика. Последняя точка может приходить повторно с тем же timestamp,
        пока интервал не закрыт, — клиент заменяет её значение, а не добавляет новую.
      required: [type, subscriptionId, points]
      properties:
        type:
          type: string
          const: chart.points
        subscriptionId:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ChartPoint'

    WsIncidentEvent:
      type: object
      required: [type, subscriptionId, event, incident]
      properties:
        type:
          type: string
          const: incident.event
        subscriptionId:
          type: string
        event:
          type: string
          enum: [opened, acknowledged, resolved]
        incident:
          $ref: '#/components/schemas/Incident'

    WsActionRunUpdate:
      type: object
      required: [type, subscriptionId, run]
      properties:
        type:
          type: string
          const: action_run.update
        subscriptionId:
          type: string
        run:
          $ref: '#/components/schemas/ActionRun'

    WsError:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        subscriptionId:
          type: [string, 'null']
          description: Подписка, к которой относится ошибка; `null` — ошибка соединения
        code:
          type: string
          enum: [bad_message, unknown_channel, table_not_found, chart_not_found, forbidden, subscription_limit, internal]
        message:
          type: string

    WsPong:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
