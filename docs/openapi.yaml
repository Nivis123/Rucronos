  # ---------------------------------------------------------------- Thresholds

  /thresholds:
    get:
      tags: [Thresholds]
      operationId: listThresholds
      summary: Список порогов
      description: |
        Фильтр `tableId` нужен экрану графиков: чтобы нарисовать линии порогов поверх графика таблицы
        (то же приходит и в `chart.snapshot` по WebSocket). Роль — любая.
      parameters:
        - name: targetKind
          in: query
          schema:
            $ref: '#/components/schemas/ThresholdTargetKind'
        - name: tableId
          in: query
          description: Пороги на эту таблицу и её колонки
          schema:
            type: string
        - name: nodeId
          in: query
          description: Пороги на этот узел (включая пороги «на все узлы»)
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Пороги
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Thresholds]
      operationId: createThreshold
      summary: Создать порог
      description: |
        Порог вешается на одну из трёх целей:
        - **метрику узла** — например, CPU мастера больше 99%;
        - **метрику таблицы** — например, в таблице больше 100 млн строк;
        - **колонку таблицы** — например, `k8s_nodes.memory_utilization` больше 92 (среднее за 1 минуту).

        Порог проверяет бэкенд (Threshold Evaluator). При срабатывании он открывает инцидент
        и сам отправляет уведомления во все каналы из `channelIds` (пуш, почта, Telegram) —
        приложение в отправке не участвует. Роль — `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdInput'
            examples:
              nodeCpu:
                summary: CPU любого узла > 99% дольше минуты
                value:
                  name: CPU почти 100%
                  enabled: true
                  target:
                    kind: node_metric
                    nodeId: null
                    metric: cpuUsagePercent
                  condition:
                    operator: gt
                    value: 99
                  forSeconds: 60
                  severity: critical
                  channelIds: [3f9a1c2e-0000-4000-8000-000000000001]
                  cooldownSeconds: 900
              tableRows:
                summary: В таблице больше 100 млн строк
                value:
                  name: k8s_nodes переполнена
                  enabled: true
                  target:
                    kind: table_metric
                    tableId: public.k8s_nodes
                    metric: rowCount
                  condition:
                    operator: gt
                    value: 100000000
                  forSeconds: 0
                  severity: warning
                  channelIds: [3f9a1c2e-0000-4000-8000-000000000002]
                  cooldownSeconds: 3600
              columnValue:
                summary: memory_utilization > 92 (среднее за минуту)
                value:
                  name: Память нод k8s
                  enabled: true
                  target:
                    kind: column
                    tableId: public.k8s_nodes
                    column: memory_utilization
                    aggregation: avg
                    windowSeconds: 60
                  condition:
                    operator: gt
                    value: 92
                  forSeconds: 120
                  severity: warning
                  channelIds: [3f9a1c2e-0000-4000-8000-000000000001]
                  cooldownSeconds: 600
      responses:
        '201':
          description: Порог создан
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Цель не найдена или не подходит (нет такой таблицы, колонка не числовая, неизвестный канал)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /thresholds/{thresholdId}:
    parameters:
      - $ref: '#/components/parameters/ThresholdId'
    get:
      tags: [Thresholds]
      operationId: getThreshold
      summary: Порог
      description: Роль — любая.
      responses:
        '200':
          description: Порог
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Thresholds]
      operationId: replaceThreshold
      summary: Изменить порог целиком
      description: Роль — `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdInput'
      responses:
        '200':
          description: Порог обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [Thresholds]
      operationId: patchThreshold
      summary: Частично изменить порог (например, включить или выключить)
      description: |
        JSON Merge Patch (RFC 7396): передаются только меняемые поля.
        Типичный случай — переключатель на карточке порога: `{"enabled": false}`. Роль — `admin`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ThresholdPatch'
            example:
              enabled: false
      responses:
        '200':
          description: Порог обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Thresholds]
      operationId: deleteThreshold
      summary: Удалить порог
      description: Открытые инциденты по порогу остаются в журнале и закрываются автоматически. Роль — `admin`.
      responses:
        '204':
          description: Порог удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

