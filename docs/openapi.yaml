              $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: thresholdId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Открыт не раньше
          schema:
            type: string
            format: date-time
        - name: to
