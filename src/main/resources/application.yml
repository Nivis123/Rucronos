server:
  port: 8080
  servlet.context-path: /api/v1
spring:
  application.name: ruchronos-manager
  datasource:
    url: jdbc:h2:mem:ruchronos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jackson.default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info
ruchronos:
  version: 0.1.0
  auth:
    mode: ${AUTH_MODE:mock}
    issuer-url: ${OIDC_ISSUER_URL:}
    client-id: ${OIDC_CLIENT_ID:ruchronos-mobile}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
    jwt-secret: ${JWT_SECRET:local-dev-only-change-this-secret-32-bytes-minimum}
  health.k8s-connected: ${K8S_CONNECTED:false}
